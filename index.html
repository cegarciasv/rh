<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite Psicométrica - Recursos Humanos</title>
    <style>
        :root {
            --primary: #0f2444;
            --accent: #c8973a;
            --bg: #f4f7f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { color: var(--primary); margin-bottom: 30px; text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            text-decoration: none;
            color: var(--primary);
            transition: transform 0.2s, border 0.2s;
            border: 2px solid transparent;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }
        .card h3 { margin-top: 0; margin-bottom: 10px; }
        .card p { font-size: 0.9em; color: #666; margin: 0; }
    </style>
</head>
<body>

    <h1>Evaluaciones Psicométricas</h1>

    <div class="grid">
        <a href="integra-platform.html" class="card">
            <h3>🛡️ INTEGRA</h3>
            <p>Evaluación de Integridad y Ética Laboral</p>
        </a>
        <a href="moss-test-system (1).html" class="card">
            <h3>👥 MOSS</h3>
            <p>Adaptabilidad Social y Liderazgo</p>
        </a>
        <a href="cleaver-sistema (1).html" class="card">
            <h3>📊 CLEAVER</h3>
            <p>Comportamiento y Perfil de Puesto (DISC)</p>
        </a>
        <a href="16PF_Test.html" class="card">
            <h3>🧠 16PF</h3>
            <p>Cuestionario de Factores de Personalidad</p>
        </a>
    </div>

</body>
</html>
